<div class="modal-overlay player-fundo"
     onclick="if (event.target === this) document.getElementById('modal-container').replaceChildren()">

    <div class="player-caixa" role="dialog" aria-modal="true" aria-labelledby="player-titulo">

        <!-- Topo -->
        <div class="player-topo">
            <div class="player-info">
                <span class="modal-marca">PYFLIX</span>
                <h2 id="player-titulo">{{ nome }}</h2>
            </div>

            <button type="button" class="player-fechar" aria-label="Fechar"
                onclick="document.getElementById('modal-container').replaceChildren()">
                &times;
            </button>
        </div>

        <!-- Vídeo -->
        <div class="player-tela">
            {% if video %}
            <video class="player-video" controls autoplay playsinline
                   {% if cartaz %}poster="{{ cartaz.url }}"{% endif %}>
                <source src="{{ video.url }}" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
            {% else %}
            <div class="player-vazio">
                <span>▶</span>
                <p>Vídeo indisponível no momento.</p>
            </div>
            {% endif %}
        </div>

        <!-- Rodapé -->
        <div class="player-rodape">
            <span class="modal-genero">{{ categoria }}</span>
            <span class="player-dica">Clique fora para fechar</span>
        </div>

    </div>
</div>
